# melpazoid <https://github.com/riscy/melpazoid>: the checks MELPA's reviewers
# run on a recipe (its build, package-lint, byte-compile, checkdoc, and its
# own), in a container with the newest Emacs.

name: melpazoid

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  melpazoid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: Run (scripts/melpazoid.sh, a warning failing it)
        env:
          MELPAZOID: ${{ runner.temp }}/melpazoid
          # Not on MELPA yet: true once it is.
          EXIST_OK: false
        run: echo $GITHUB_REF && scripts/melpazoid.sh
