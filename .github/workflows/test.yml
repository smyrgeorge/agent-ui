name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    # The development snapshot can break on its own: said, not failing the run.
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        # 29.1: the oldest Emacs it supports (Package-Requires); 31.1: the
        # newest release.
        emacs: ['29.1', '30.2', '31.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4
        with:
          # The bug report's test reads the library's commit.
          fetch-depth: 0

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Dependencies
        run: make deps

      - name: Byte-compile every file (warnings are errors)
        run: make compile && make clean

      - name: package-lint
        run: make package-lint

      - name: checkdoc
        run: make checkdoc

      - name: Unit tests
        run: make test
